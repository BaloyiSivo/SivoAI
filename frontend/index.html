<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SivoAI</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <header>

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <div>
                <h1>SivoAI</h1>

                <div class="status">
                    ● Local AI Online
                </div>

            </div>

        </div>

    </header>


    <main id="chat">

        <div class="welcome">

            <div class="welcome-icon">
                🤖
            </div>

            <h2>Welcome to SivoAI</h2>

            <p>
                Your local AI assistant powered by Qwen 2.5 3B.
            </p>

        </div>

    </main>


    <div class="input-container">

        <div class="input-box">

            <textarea
                id="question"
                placeholder="Ask AfriAI anything..."
                rows="1"></textarea>

            <button id="send">
                Send
            </button>

        </div>

        <div class="footer">
            SivoAI • Local AI Assistant
        </div>

    </div>

</div>


<script src="/static/script.js"></script>

</body>

</html>
